<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HR Компас — подбери вакансию</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#1f3d6b;--navy2:#142a4d;--gold:#c9a043;--gold2:#e2c16e;--bg:#fff;--bg2:#f3f5f9;--text:#142a4d;--muted:#5b6b86;--line:#dde3ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a30;--bg2:#162744;--text:#f2f5fb;--muted:#a3b2cc;--line:#26395c}}
:root[data-theme="dark"]{--bg:#0e1a30;--bg2:#162744;--text:#f2f5fb;--muted:#a3b2cc;--line:#26395c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:500 16px/1.5 Montserrat,Arial,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0}
.brand{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none}
.brand img{width:58px;height:auto;mix-blend-mode:multiply;border-radius:8px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand img{mix-blend-mode:normal;background:#fff;padding:3px}}
.brand b{font-size:24px;font-weight:800;letter-spacing:.2px}.brand b i{font-style:normal;color:var(--gold)}
.tg{display:inline-flex;align-items:center;gap:10px;padding:9px 16px 9px 10px;border-radius:999px;background:var(--navy);color:#fff;text-decoration:none;font-size:13px;font-weight:600;line-height:1.2}
.tg span{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--gold);color:var(--navy2);font-size:15px}
.tg small{display:block;font-weight:500;opacity:.8;font-size:11px}
.tg:hover{background:var(--navy2)}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.hero{padding:44px 0 26px;max-width:720px}
h1{font-size:clamp(32px,5.4vw,56px);line-height:1.08;margin:0 0 14px;font-weight:800;letter-spacing:-.5px}
.hero p{margin:0;color:var(--muted);font-size:18px;max-width:560px}
.bar{display:flex;justify-content:space-between;align-items:end;margin:28px 0 14px}
.bar h2{margin:0;font-size:22px;font-weight:700}
.arrows{display:flex;gap:8px}
.arrows button{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);color:var(--text);font-size:18px;cursor:pointer}
.arrows button:hover{border-color:var(--gold);color:var(--gold)}
.track{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 20px 24px;margin:0 -20px;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.card{flex:0 0 min(300px,78vw);height:440px;scroll-snap-align:start;border-radius:28px;padding:26px;display:flex;flex-direction:column;position:relative;overflow:hidden;color:#fff;text-decoration:none;background:linear-gradient(160deg,var(--navy) 0%,var(--navy2) 100%)}
.card.gold{background:linear-gradient(160deg,var(--gold2) 0%,var(--gold) 100%);color:var(--navy2)}
.card small{font-size:15px;font-weight:600;opacity:.85}
.card h3{margin:10px 0 0;font-size:22px;line-height:1.22;font-weight:700;max-width:230px}
.card .ico{position:absolute;right:-18px;bottom:62px;font-size:150px;line-height:1;opacity:.95;filter:drop-shadow(0 12px 18px rgba(0,0,0,.25));transition:transform .25s}
.card:hover .ico{transform:rotate(-6deg) scale(1.05)}
.card .go{margin-top:auto;align-self:flex-start;position:relative;padding:12px 26px;border-radius:14px;background:var(--gold);color:var(--navy2);font-weight:700;font-size:16px}
.card.gold .go{background:var(--navy);color:#fff}
.ring{position:absolute;left:-60px;top:170px;width:220px;height:220px;border-radius:50%;border:2px solid rgba(255,255,255,.1)}
.card.gold .ring{border-color:rgba(20,42,77,.15)}
.back{display:inline-flex;align-items:center;gap:8px;margin:24px 0 8px;padding:10px 18px;border-radius:999px;border:1.5px solid var(--line);background:none;color:var(--text);font:600 14px Montserrat,sans-serif;cursor:pointer}
.back:hover{border-color:var(--gold)}
.ttl{display:flex;align-items:center;gap:14px;margin:8px 0 26px}
.ttl .ico{width:64px;height:64px;border-radius:20px;background:var(--navy);display:grid;place-items:center;font-size:34px}
.ttl h1{font-size:clamp(28px,4.4vw,44px);margin:0}
.ttl p{margin:2px 0 0;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;padding-bottom:40px}
.vac{background:var(--bg2);border:1px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:12px}
.sk{height:14px;border-radius:7px;background:var(--line)}
.sk.t{height:22px;width:70%;background:var(--navy);opacity:.18}
.chip{align-self:flex-start;padding:6px 12px;border-radius:999px;background:var(--gold);color:var(--navy2);font-size:13px;font-weight:700}
.vac button{margin-top:8px;padding:12px;border-radius:14px;border:0;background:var(--navy);color:#fff;font:600 15px Montserrat,sans-serif;opacity:.55;cursor:not-allowed}
.note{margin:0 0 40px;padding:16px 20px;border-radius:16px;border:1.5px dashed var(--gold);color:var(--muted);font-size:14px}
.intro{margin:0 0 28px;padding:22px 24px;border-radius:22px;background:var(--bg2);border-left:5px solid var(--gold)}.intro h2{margin:0 0 6px;font-size:20px}.intro p{margin:0 0 14px;color:var(--muted);max-width:720px}.perks{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}.perks li{padding:7px 14px;border-radius:999px;background:var(--navy);color:#fff;font-size:13px;font-weight:600}
.flip{perspective:1200px;height:520px}.fi{position:relative;width:100%;height:100%;transition:transform .65s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}.flip.on .fi{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:28px;padding:26px;display:flex;flex-direction:column;overflow:hidden;color:#fff;background:linear-gradient(160deg,var(--navy),var(--navy2));transition:visibility 0s .3s}.flip.g .face{background:linear-gradient(160deg,var(--gold2),var(--gold));color:var(--navy2)}
.fb{transform:rotateY(180deg)}.flip:not(.on) .fb,.flip.on .ff{visibility:hidden}
.face small{font-size:15px;font-weight:600;opacity:.85}.face h3{margin:8px 0 14px;font-size:21px;line-height:1.22;font-weight:700}
.sh{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:14.5px;font-weight:600;max-width:210px}.sh li:before{content:"✓ ";color:var(--gold)}.flip.g .sh li:before{color:var(--navy)}
.face .ico{position:absolute;right:-10px;bottom:84px;font-size:118px;line-height:1;filter:drop-shadow(0 12px 18px rgba(0,0,0,.25));transition:transform .25s}.flip:hover .ico{transform:rotate(-6deg) scale(1.05)}
.ff .chip{margin-top:auto;margin-bottom:12px;position:relative}.ff .chip+.acts{margin-top:0}.flip.g .chip{background:var(--navy);color:#fff}
.acts{margin-top:auto;display:flex;gap:10px;align-items:center;position:relative}
.go2.off{opacity:.55;cursor:not-allowed}.go2{padding:12px 24px;border-radius:14px;background:var(--gold);color:var(--navy2);font-weight:700;font-size:16px;text-decoration:none;text-align:center}.flip.g .go2{background:var(--navy);color:#fff}
.inf{flex:none;width:46px;height:46px;border-radius:50%;border:2px solid currentColor;background:none;color:inherit;font:italic 700 21px Georgia,serif;cursor:pointer}.inf:hover{background:rgba(255,255,255,.18)}
.bh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.bh b{font-size:18px}.bd{flex:1;overflow:auto;font-size:13.5px;line-height:1.45;padding-right:6px;margin-bottom:12px}.bd h4{margin:12px 0 4px;font-size:14px}.bd h4:first-child{margin-top:0}.bd ul{margin:0;padding-left:18px}.bd li{margin-bottom:3px}
footer{border-top:1px solid var(--line);padding:22px 0 30px;color:var(--muted);font-size:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer a{color:var(--gold);font-weight:700;text-decoration:none}
.cityb{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg2);color:var(--text);font:600 14px Montserrat,sans-serif;cursor:pointer;max-width:200px}
.cityb:hover{border-color:var(--gold)}.cityb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cityb i{font-style:normal;color:var(--gold)}
.cnt{position:absolute;right:20px;top:20px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.18);font-size:13px;font-weight:700;z-index:1}.card.gold .cnt{background:rgba(20,42,77,.12)}
.cm{position:fixed;inset:0;z-index:50;background:rgba(10,20,40,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.cmb{background:var(--bg);color:var(--text);width:min(460px,100%);height:min(600px,86vh);border-radius:24px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.cmh{display:flex;justify-content:space-between;align-items:center;padding:20px 22px 8px}.cmh b{font-size:20px}
.cmx{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:none;color:inherit;font-size:20px;cursor:pointer}
.cms{margin:8px 22px 10px;padding:12px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg2);color:var(--text);font:500 15px Montserrat,sans-serif}
.cml{list-style:none;margin:0;padding:0 12px 14px;overflow:auto;flex:1;min-height:0}
.cml li{padding:11px 12px;border-radius:12px;cursor:pointer;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.cml li:hover{background:var(--bg2)}.cml li.on{background:var(--navy);color:#fff}.cml li.on:after{content:"✓";color:var(--gold2)}
.cml li.sep{cursor:default;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding:10px 12px 4px}.cml li.sep:hover{background:none}
.cml li.cme{cursor:default;color:var(--muted)}
.empty{margin:0 0 40px;padding:22px;border-radius:16px;border:1.5px dashed var(--gold);color:var(--muted)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:560px){.tg small{display:none}.brand b{font-size:20px}.brand img{width:46px}.arrows{display:none}.hero{padding-top:28px}}
</style></head><body>

function vvParse(t){var out=[],seen={},re=/^(?:"((?:[^"]|"")*)"|([^,\r\n]*))/;
 t.split(/\r?\n/).forEach(function(line){var m=re.exec(line);if(!m)return;var c=(m[1]!==undefined?m[1].replace(/""/g,'"'):m[2]).trim();
  if(!c||/^(город|итого|общий итог|не определ)/i.test(c))return;var k=nrm(c);if(seen[k])return;seen[k]=1;out.push(c)});return out}

function nrm(s){return String(s||"").toLowerCase().replace(/\u0451/g,"\u0435").trim()}
function inCity(v){if(!v.geo)return true;var c=nrm(CITY);return v.geo.some(function(x){return nrm(x)===c})}

 if(typeof k!=="string")k=(location.hash||"").slice(1);var c=CATS[k];
